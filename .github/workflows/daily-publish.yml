name: High-Authority Article Publishing (3-4 Weekly)

on:
  schedule:
    # Runs at 00:00 UTC on Monday, Wednesday, Friday, and Sunday (4 articles per week)
    - cron: '0 0 * * 1,3,5,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Auto-Publish Script (1 Flagship In-Depth Article)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai-publish.mjs --count=1
